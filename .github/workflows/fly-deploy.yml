# Push-to-deploy in SPLIT mode (P1-8). On every push to master this deploys the game fleet (one app at a
# time, each drained first so no live match is cut), then the control plane.
#
# REPLACES fly.io's built-in GitHub auto-deploy (which only deploys the single root fly.toml = monolith).
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   FLY_API_TOKEN    — `fly tokens create deploy` (org-wide, so it can deploy all three apps)
#   INTERNAL_SECRET  — the same value as the fly apps' INTERNAL_SECRET secret. Lets this workflow call
#                      /internal/drain and /internal/health on the game servers. WITHOUT it the game apps
#                      are deployed blind (a rolling replace that kills any live match) — a warning is
#                      printed. Read the current value with:
#                      fly ssh console -a msbattle-game -C "printenv INTERNAL_SECRET"

name: Deploy (split)

on:
  push:
    branches: [master]

concurrency:
  group: fly-deploy           # never run two deploys at once
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy game + main
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
      GAME_APPS: msbattle-game msbattle-game-b
      # How long to wait for a drained game server's live matches to finish before deploying it anyway.
      DRAIN_MAX_WAIT_S: "1500"
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Game fleet, ONE APP AT A TIME. For each: take it out of rotation (main routes new matches to the
      # other app), wait for its live matches to end, deploy it, then move on. The drained app comes back
      # un-drained after the deploy (a fresh process), so the next app can drain while this one takes matches.
      - name: Drain, wait for, and deploy each game server in turn
        run: |
          set -u
          for app in $GAME_APPS; do
            url="https://$app.fly.dev"
            if ! flyctl status --app "$app" >/dev/null 2>&1; then
              echo "::warning::$app does not exist yet (fly apps create $app + secrets, see DEPLOY_SPLIT.md) — skipping"
              continue
            fi
            if [ -n "$INTERNAL_SECRET" ]; then
              if curl -fsS -m 15 -X POST -H "x-internal-secret: $INTERNAL_SECRET" -H "content-type: application/json" -d '{}' "$url/internal/drain"; then
                echo; echo "$app: draining — waiting for live matches to finish (max ${DRAIN_MAX_WAIT_S}s)"
                waited=0
                while [ "$waited" -lt "$DRAIN_MAX_WAIT_S" ]; do
                  active=$(curl -fsS -m 15 -H "x-internal-secret: $INTERNAL_SECRET" "$url/internal/health" | jq -r '.activeMatches' 2>/dev/null || echo "?")
                  echo "$app: activeMatches=$active (${waited}s)"
                  if [ "$active" = "0" ]; then break; fi
                  if [ "$active" = "?" ]; then echo "::warning::$app: health check failed — deploying"; break; fi
                  sleep 10; waited=$((waited + 10))
                done
                if [ "$waited" -ge "$DRAIN_MAX_WAIT_S" ]; then echo "::warning::$app: still has live matches after ${DRAIN_MAX_WAIT_S}s — deploying anyway"; fi
              else
                echo; echo "::warning::$app: could not drain (not deployed yet, or down) — deploying without waiting"
              fi
            else
              echo "::warning::INTERNAL_SECRET repo secret not set — deploying $app WITHOUT draining (live matches on it will be cut)"
            fi
            flyctl deploy --config fly.game.toml --app "$app" --remote-only
            # Pin each game app to EXACTLY ONE machine: fly has no machine-count field in fly.toml for
            # Machines apps (min_machines_running is only the auto-stop floor) and creates 2 by default —
            # but with >1 machine behind one hostname a client's match socket can land on a different
            # machine than the one main allocated to, and the attach fails. More capacity = more apps.
            flyctl scale count 1 --config fly.game.toml --app "$app" --yes
          done

      # Control plane (erik-minesweeper). A brief blip here does NOT interrupt live games — those run on the
      # game fleet, and a game server retries its result report while main restarts.
      - name: Deploy control plane (main)
        run: flyctl deploy --config fly.main.toml --remote-only
