<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=optional">
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<meta name="theme-color" content="#6366f1">
	<!-- Plausible: privacy-friendly analytics. No cookies, so no consent banner.
	     The standard script tracks react-router's pushState navigations on its own.
	     The second line queues plausible() calls made before the deferred script has
	     loaded. Plausible ignores localhost, so this is inert in dev. -->
	<script defer data-domain="msbattle.net" src="https://plausible.io/js/script.js"></script>
	<script>window.plausible = window.plausible || function () { (window.plausible.q = window.plausible.q || []).push(arguments) };</script>
	<title>MSBattle</title>
</head>
<body>
	<div id="root"></div>
	<script type="module" src="/src/main.tsx"></script>
</body>
</html>
